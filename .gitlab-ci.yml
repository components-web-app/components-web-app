image: alpine:latest

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^create-cwa\//
      when: never
    # No merge request pipelines: the branch pipeline already runs everything, and the
    # MR shows its result. Every job is filtered to branches, so an MR pipeline would
    # hold nothing useful, and "Pipelines must succeed" would judge the MR by it (#88).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  BUILD_DISABLED: "false"
  TEST_DISABLED: "false"
  STAGING_ENABLED: "true"
  CANARY_ENABLED: "true"
  ENABLE_DATABASE_FIXTURES: "false"
  # Node, npx and Chrome for the performance audit jobs (#87). Pinned so a Chrome
  # update can't move the numbers between pipelines unnoticed.
  PERFORMANCE_AUDIT_IMAGE: "cypress/browsers:node-24.21.0-chrome-153.0.8010.36-1-ff-156.0-edge-153.0.4234.32-1"

stages:
  - build
  - test
  - review
  - staging
  - canary
  - production
  - cleanup

before_script:
  - source ./bin/devops/setup.sh
  - source ./bin/devops/k8s.sh
  #- source ./bin/devops/vercel.sh

build api:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - install_dependencies
    - generate_jwt_keys
    - setup_docker_environment
    - build_api
  cache:
    - key:
        files:
          - api/composer.lock
      paths:
        - api/vendor/
  only:
    - branches
  except:
    variables:
      - $BUILD_DISABLED == "true"
       
build app:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - install_dependencies
    - setup_docker_environment
    - build_app
  only:
    - branches
  except:
    variables:
      - $BUILD_DISABLED == "true"

unit tests:
  image: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG
  stage: test
  script:
    - run_test_phpunit
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-purge-isolation.sh
  artifacts:
    reports:
      junit: api/build/logs/phpunit/junit.xml
  needs:
    - job: build api
      optional: true
  # Like every other job. Without it, a pipeline with no build (a merge request or a
  # tag) holds this job alone, and it fails pulling an image that was never pushed (#88).
  only:
    - branches
  except:
    variables:
      - $TEST_DISABLED == "true"

behat tests:
  stage: test
  image: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG
  variables:
    COMPOSER_PACKAGIST_TOKEN: 1548c14cbc7ef945787cad19913d10ef73068d7cdc61ff19513bfb4f72ea
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: "password"
    POSTGRES_DB: test
    POSTGRES_HOST_AUTH_METHOD: trust
  allow_failure: false
  services:
    - postgres:14
  script:
    - setup_test_db_environment
    - run_test_behat
  dependencies: [ ]
  needs:
    - job: build api
      optional: true
  only:
    - branches
  artifacts:
    reports:
      junit: api/build/logs/behat/junit/default.xml
  except:
    variables:
      - $TEST_DISABLED == "true"

