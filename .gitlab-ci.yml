staging:
  retry: 1
  stage: staging
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy staging
    - purge_rendered_html staging
    # Non-fatal by design; see the comment in the review job (#80).
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'behat tests'
      optional: true
  only:
    refs:
      - main
    variables:
      - $STAGING_ENABLED == "true"
  allow_failure: false

