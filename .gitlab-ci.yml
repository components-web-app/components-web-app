image: alpine:latest

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^create-cwa\//
      when: never
    # No merge request pipelines: the branch pipeline already runs everything, and the
    # MR shows its result. Every job is filtered to branches, so an MR pipeline would
    # hold nothing useful, and "Pipelines must succeed" would judge the MR by it (#88).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  CWA_CI_BUILD_DISABLED: "false"
  CWA_CI_TEST_DISABLED: "false"
  CWA_CI_STAGING_ENABLED: "true"
  CWA_CI_CANARY_ENABLED: "true"
  CWA_CI_FIXTURES_ENABLED: "false"
  # Makes a manual fixture job empty the database before loading: "true" on review
  # apps, "force" for production. Staging has no fixture job. See load_fixtures in
  # bin/devops/k8s.sh.
  CWA_CI_FIXTURES_PURGE: "false"
  # Node, npx and Chrome for the performance audit jobs (#87). Pinned so a Chrome
  # update can't move the numbers between pipelines unnoticed.
  CWA_CI_PERFORMANCE_AUDIT_IMAGE: "cypress/browsers:node-24.21.0-chrome-153.0.8010.36-1-ff-156.0-edge-153.0.4234.32-1"

stages:
  - build
  - test
  - review
  - staging
  - canary
  - production
  - cleanup

before_script:
  - source ./bin/devops/setup.sh
  - source ./bin/devops/k8s.sh
  #- source ./bin/devops/vercel.sh

build api:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - install_dependencies
    - setup_docker_environment
    - build_api
  # The pushed digest, which the deploys pin and promote (#164).
  artifacts:
    reports:
      dotenv: image_digest.env
  cache:
    - key:
        files:
          - api/composer.lock
      paths:
        - api/vendor/
  only:
    - branches
  except:
    variables:
      - $CWA_CI_BUILD_DISABLED == "true"
       
build app:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - install_dependencies
    - setup_docker_environment
    - build_app
  # The pushed digest, which the deploys pin and promote (#164).
  artifacts:
    reports:
      dotenv: image_digest.env
  only:
    - branches
  except:
    variables:
      - $CWA_CI_BUILD_DISABLED == "true"

unit tests:
  image: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG
  stage: test
  # For souin-redis-shared-purge.sh (#85), at redis:6379.
  services:
    - redis:8.10.2
  script:
    - run_test_phpunit
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-purge-isolation.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-flush-storage.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-coalesced-5xx.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-php-flush.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-redis-shared-purge.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/caddy-validate.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/cache-encoding.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/storage-prefix-parity.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/api-scaling-config.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/api-warm-surge.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-backend-timeout.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/database-guard.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/deploy-promotion.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/backup-bucket.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/php-base-version.sh
  artifacts:
    reports:
      junit: api/build/logs/phpunit/junit.xml
  needs:
    - job: build api
      optional: true
  # Like every other job. Without it, a pipeline with no build (a merge request or a
  # tag) holds this job alone, and it fails pulling an image that was never pushed (#88).
  only:
    - branches
  except:
    variables:
      - $CWA_CI_TEST_DISABLED == "true"

functional tests:
  stage: test
  image: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG
  variables:
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: "password"
    POSTGRES_DB: test
    POSTGRES_HOST_AUTH_METHOD: trust
  allow_failure: false
  services:
    - postgres:14
  script:
    - setup_test_db_environment
    - run_test_functional
  dependencies: [ ]
  needs:
    - job: build api
      optional: true
  only:
    - branches
  artifacts:
    reports:
      junit: api/build/logs/phpunit/functional.xml
  except:
    variables:
      - $CWA_CI_TEST_DISABLED == "true"

# Browser tests (#157): this ref's images in a throwaway stack, before any deploy. Opt-in with CWA_CI_E2E_ENABLED="true".
browser tests:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  dependencies: [ ]
  needs:
    - job: build api
      optional: true
    - job: build app
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH && $CWA_CI_E2E_ENABLED == "true" && $CWA_CI_TEST_DISABLED != "true"'
  script:
    - apk add --no-cache openssl >/dev/null
    - setup_docker_environment
    - run_browser_tests
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    reports:
      junit: e2e/test-results/junit.xml

# Optional Vercel review PWA job (deploy_vercel_app review in bin/devops/vercel.sh); its definition is in v2.0.0-alpha.17's .gitlab-ci.yml.

review:
  stage: review
  script:
    - check_kube_domain
    - install_dependencies
    - helm_init
    - apply_kube_context
    # Ends with exit code 3 when this branch has no namespace (see k8s.sh), which
    # allow_failure below turns into an orange warning rather than a red pipeline.
    - skip_review_without_namespace
    - ensure_namespace
    - create_docker_pull_secret
    - deploy review
    - purge_rendered_html review
    - persist_environment_url
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    on_stop: stop review
  # Only a branch without a namespace (REVIEW_NO_NAMESPACE_EXIT_CODE in k8s.sh) may
  # fail here. A deploy that really fails still turns the pipeline red (#4).
  allow_failure:
    exit_codes: [3]
  artifacts:
    paths: [ environment_url.txt ]
  only:
    refs:
      - branches
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
    - job: 'browser tests'
      optional: true
  except:
    refs:
      - main
    variables:
      - $CWA_CI_REVIEW_DISABLED == "true"

# Optional Vercel staging PWA job (deploy_vercel_app staging in bin/devops/vercel.sh); its definition is in v2.0.0-alpha.17's .gitlab-ci.yml.

staging:
  # Only when CI itself failed, never the deploy script: a retried maintenance window would back up and migrate again (#180).
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure, scheduler_failure, runner_unsupported, data_integrity_failure]
  stage: staging
  script:
    - check_kube_domain
    - install_dependencies
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy staging
    - purge_rendered_html staging
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
    - job: 'browser tests'
      optional: true
  only:
    refs:
      - main
    variables:
      - $CWA_CI_STAGING_ENABLED == "true"
  allow_failure: false

# Optional Vercel production PWA job (deploy_vercel_app in bin/devops/vercel.sh); its definition is in v2.0.0-alpha.17's .gitlab-ci.yml.

production:
  stage: production
  script:
    - check_kube_domain
    - install_dependencies
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy
    - purge_rendered_html
    # Ends a CWA_CI_MAINTENANCE_DURING_MIGRATIONS window (#180); nothing to do without one.
    - finish_maintenance_window
    - delete canary
    - delete staging
    - persist_environment_url
  # A failed window leaves maintenance on: repeat what to do at the end of the log (#180).
  after_script:
    - '[ ! -f maintenance-window.txt ] || cat maintenance-window.txt'
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  artifacts:
    paths: [ environment_url.txt ]
  when: manual
  # Only when CI itself failed, never the deploy script: a retried maintenance window would back up and migrate again (#180).
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure, scheduler_failure, runner_unsupported, data_integrity_failure]
  allow_failure: false
  # Needs the builds and tests too: without staging, needs: [] would deploy the
  # previous image. Optional, as the switches can remove them.
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
    - job: 'browser tests'
      optional: true
    - job: 'staging'
      optional: true
  only:
    refs:
      - main
  except:
    variables:
      - $CWA_CI_PRODUCTION_DISABLED == "true"

# The pending migrations and their SQL for production, read-only, with this pipeline's php image (#180). Read it before
# pressing the production deploy. CWA_CI_MIGRATIONS_PLAN_PRODUCTION="false" removes it; a failure never blocks the deploy.
migrations plan production:
  stage: production
  needs:
    - job: 'build api'
      optional: true
    - job: 'staging'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_PRODUCTION_DISABLED != "true" && $CWA_CI_MIGRATIONS_PLAN_PRODUCTION != "false"'
  script:
    - install_dependencies
    - helm_init
    - apply_kube_context
    - set_namespace
    - migrations_plan stable

# A database backup on demand, e.g. before risky manual work (#180). Needs CWA_CI_DATABASE_BACKUP_BUCKET and the
# project's CWA_CI_DATABASE_BACKUP_GCLOUD_JSON (bin/devops/backup-bucket.sh).
database backup production:
  stage: production
  when: manual
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_PRODUCTION_DISABLED != "true" && $CWA_CI_DATABASE_BACKUP_BUCKET'
  script:
    - install_dependencies
    - helm_init
    - apply_kube_context
    - set_namespace
    - database_backup_now stable

# After each deploy: generate missing image variants in their own Jobs (#152, #153), then warm https://$DOMAIN (#80, #132).
# One job, so the warm doesn't wait for another runner (#160); each half keeps its own switch. allow_failure: never fails a live deploy.
image variants and warm review:
  stage: review
  needs: ['review']
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CWA_CI_REVIEW_DISABLED != "true" && ($CWA_CI_IMAGE_VARIANTS_REVIEW == "true" || $CWA_CI_WARM_CACHE_REVIEW == "true")'
  script:
    - skip_unless_review_deployed
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - image_variants_and_warm review

image variants and warm staging:
  stage: staging
  needs: ['staging']
  allow_failure: true
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_STAGING_ENABLED == "true" && ($CWA_CI_IMAGE_VARIANTS_STAGING == "true" || $CWA_CI_WARM_CACHE_STAGING == "true")'
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - image_variants_and_warm staging

image variants and warm canary:
  stage: canary
  needs: ['canary']
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_CANARY_ENABLED == "true" && ($CWA_CI_IMAGE_VARIANTS_CANARY == "true" || $CWA_CI_WARM_CACHE_CANARY == "true")'
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - image_variants_and_warm canary

image variants and warm production:
  stage: production
  needs: ['production']
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_PRODUCTION_DISABLED != "true" && ($CWA_CI_IMAGE_VARIANTS_PRODUCTION != "false" || $CWA_CI_WARM_CACHE_PRODUCTION != "false")'
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - image_variants_and_warm stable

# Lighthouse CI audit (#87): manual, after the deploy and its warm. Canary is opt-in
# (it shares production's hostname). A missed budget never fails a deploy.
performance audit review:
  stage: review
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'review'
    - job: 'image variants and warm review'
      optional: true
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CWA_CI_REVIEW_DISABLED != "true" && $CWA_CI_PERFORMANCE_AUDIT_REVIEW != "false"'
      when: manual
  script:
    - skip_unless_review_deployed
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit staging:
  stage: staging
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'staging'
    - job: 'image variants and warm staging'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_STAGING_ENABLED == "true" && $CWA_CI_PERFORMANCE_AUDIT_STAGING != "false"'
      when: manual
  script:
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit canary:
  stage: canary
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'canary'
    - job: 'image variants and warm canary'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_CANARY_ENABLED == "true" && $CWA_CI_PERFORMANCE_AUDIT_CANARY == "true"'
      when: manual
  script:
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit production:
  stage: production
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'production'
    - job: 'image variants and warm production'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_PRODUCTION_DISABLED != "true" && $CWA_CI_PERFORMANCE_AUDIT_PRODUCTION != "false"'
      when: manual
  script:
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

load fixtures review:
  stage: review
  script:
    - skip_unless_review_deployed
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures review
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$CWA_CI_FIXTURES_ENABLED != "true"'
      when: never
    - if: '$CWA_CI_REVIEW_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['review']

load fixtures production:
  stage: production
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$CWA_CI_FIXTURES_ENABLED != "true"'
      when: never
    # It needs the production job.
    - if: '$CWA_CI_PRODUCTION_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['production']

stop review:
  stage: cleanup
  # The branch may be deleted on merge, so no checkout: bin/devops comes from the default branch (#165).
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache git
    - rm -rf .cwa-default-branch bin
    - git clone --depth 1 --filter=blob:none --sparse --branch "$CI_DEFAULT_BRANCH" "$CI_REPOSITORY_URL" .cwa-default-branch
    - git -C .cwa-default-branch sparse-checkout set bin/devops
    - cp -R .cwa-default-branch/bin ./bin
    - source ./bin/devops/setup.sh
    - source ./bin/devops/k8s.sh
  script:
    - skip_unless_review_deployed
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - delete review
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
  when: manual
  allow_failure: true
  only:
    refs:
      - branches
  needs: ['review']
  except:
    refs:
      - main
    variables:
      - $CWA_CI_REVIEW_DISABLED == "true"

canary:
  stage: canary
  script:
    - check_kube_domain
    - install_dependencies
    - ensure_namespace
    - helm_init
    - apply_kube_context
    - create_docker_pull_secret
    - deploy canary
    - purge_rendered_html canary
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  when: manual
  # Needs the builds and tests too: without staging, needs: [] would deploy the
  # previous image. Optional, as the switches can remove them.
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
    - job: 'browser tests'
      optional: true
    - job: 'staging'
      optional: true
  only:
    refs:
      - main
    variables:
      - $CWA_CI_CANARY_ENABLED == "true"
