image: alpine:latest

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^create-cwa\//
      when: never
    # No merge request pipelines: the branch pipeline already runs everything, and the
    # MR shows its result. Every job is filtered to branches, so an MR pipeline would
    # hold nothing useful, and "Pipelines must succeed" would judge the MR by it (#88).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  CWA_CI_BUILD_DISABLED: "false"
  CWA_CI_TEST_DISABLED: "false"
  CWA_CI_STAGING_ENABLED: "true"
  CWA_CI_CANARY_ENABLED: "true"
  CWA_CI_FIXTURES_ENABLED: "false"
  # Makes a manual fixture job empty the database before loading: "true" on review
  # apps, "force" for production. Staging has no fixture job. See load_fixtures in
  # bin/devops/k8s.sh.
  CWA_CI_FIXTURES_PURGE: "false"
  # Node, npx and Chrome for the performance audit jobs (#87). Pinned so a Chrome
  # update can't move the numbers between pipelines unnoticed.
  CWA_CI_PERFORMANCE_AUDIT_IMAGE: "cypress/browsers:node-24.21.0-chrome-153.0.8010.36-1-ff-156.0-edge-153.0.4234.32-1"

stages:
  - build
  - test
  - review
  - staging
  - canary
  - production
  - cleanup

before_script:
  - source ./bin/devops/setup.sh
  - source ./bin/devops/k8s.sh
  #- source ./bin/devops/vercel.sh

build api:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - install_dependencies
    - generate_jwt_keys
    - setup_docker_environment
    - build_api
  cache:
    - key:
        files:
          - api/composer.lock
      paths:
        - api/vendor/
  only:
    - branches
  except:
    variables:
      - $CWA_CI_BUILD_DISABLED == "true"
       
build app:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - install_dependencies
    - setup_docker_environment
    - build_app
  only:
    - branches
  except:
    variables:
      - $CWA_CI_BUILD_DISABLED == "true"

unit tests:
  image: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG
  stage: test
  script:
    - run_test_phpunit
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-purge-isolation.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/souin-flush-storage.sh
    - cd "$CI_PROJECT_DIR" && sh bin/test/caddy-validate.sh
  artifacts:
    reports:
      junit: api/build/logs/phpunit/junit.xml
  needs:
    - job: build api
      optional: true
  # Like every other job. Without it, a pipeline with no build (a merge request or a
  # tag) holds this job alone, and it fails pulling an image that was never pushed (#88).
  only:
    - branches
  except:
    variables:
      - $CWA_CI_TEST_DISABLED == "true"

functional tests:
  stage: test
  image: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG
  variables:
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: "password"
    POSTGRES_DB: test
    POSTGRES_HOST_AUTH_METHOD: trust
  allow_failure: false
  services:
    - postgres:14
  script:
    - setup_test_db_environment
    - run_test_functional
  dependencies: [ ]
  needs:
    - job: build api
      optional: true
  only:
    - branches
  artifacts:
    reports:
      junit: api/build/logs/phpunit/functional.xml
  except:
    variables:
      - $CWA_CI_TEST_DISABLED == "true"

# Optional Vercel review PWA job (deploy_vercel_app review in bin/devops/vercel.sh); its definition is in v2.0.0-alpha.17's .gitlab-ci.yml.

review:
  stage: review
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - helm_init
    - apply_kube_context
    # Ends with exit code 3 when this branch has no namespace (see k8s.sh), which
    # allow_failure below turns into an orange warning rather than a red pipeline.
    - skip_review_without_namespace
    - ensure_namespace
    - create_docker_pull_secret
    - deploy review
    - purge_rendered_html review
    # Refill the page cache the purge just emptied, and report each page's
    - persist_environment_url
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    on_stop: stop review
  # Only a branch without a namespace (REVIEW_NO_NAMESPACE_EXIT_CODE in k8s.sh) may
  # fail here. A deploy that really fails still turns the pipeline red (#4).
  allow_failure:
    exit_codes: [3]
  artifacts:
    paths: [ environment_url.txt ]
  only:
    refs:
      - branches
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
  except:
    refs:
      - main
    variables:
      - $CWA_CI_REVIEW_DISABLED == "true"

# Optional Vercel staging PWA job (deploy_vercel_app staging in bin/devops/vercel.sh); its definition is in v2.0.0-alpha.17's .gitlab-ci.yml.

staging:
  retry: 1
  stage: staging
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy staging
    - purge_rendered_html staging
    # Non-fatal by design; see the comment in the review job (#80).
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
  only:
    refs:
      - main
    variables:
      - $CWA_CI_STAGING_ENABLED == "true"
  allow_failure: false

# Optional Vercel production PWA job (deploy_vercel_app in bin/devops/vercel.sh); its definition is in v2.0.0-alpha.17's .gitlab-ci.yml.

production:
  stage: production
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy
    - purge_rendered_html
    # Non-fatal by design; see the comment in the review job (#80).
    - delete canary
    - delete staging
    - persist_environment_url
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  artifacts:
    paths: [ environment_url.txt ]
  when: manual
  retry: 1
  allow_failure: false
  # Needs the builds and tests too: without staging, needs: [] would deploy the
  # previous image. Optional, as the switches can remove them.
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
    - job: 'staging'
      optional: true
  only:
    refs:
      - main
  except:
    variables:
      - $CWA_CI_PRODUCTION_DISABLED == "true"

# Warm the page cache after deploys (#80): production by default, the others opt-in.
# allow_failure, so a failed page never marks a live deploy failed.
warm cache review:
  stage: review
  needs: ['review']
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # The review job's conditions, plus opt-in.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CWA_CI_REVIEW_DISABLED != "true" && $CWA_CI_WARM_CACHE_REVIEW == "true"'
  script:
    - skip_unless_review_deployed
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN"

warm cache staging:
  stage: staging
  needs: ['staging']
  allow_failure: true
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # The staging job's conditions, plus opt-in.
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_STAGING_ENABLED == "true" && $CWA_CI_WARM_CACHE_STAGING == "true"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://staging.$KUBE_INGRESS_BASE_DOMAIN"

warm cache canary:
  stage: canary
  needs: ['canary']
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # The canary job's conditions, plus opt-in.
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_CANARY_ENABLED == "true" && $CWA_CI_WARM_CACHE_CANARY == "true"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://$KUBE_INGRESS_BASE_DOMAIN"

warm cache production:
  stage: production
  needs: ['production']
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # The production job's conditions; on unless "false".
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_PRODUCTION_DISABLED != "true" && $CWA_CI_WARM_CACHE_PRODUCTION != "false"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://$KUBE_INGRESS_BASE_DOMAIN"

# Lighthouse CI audit (#87): manual, after the deploy and its warm. Canary is opt-in
# (it shares production's hostname). A missed budget never fails a deploy.
performance audit review:
  stage: review
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'review'
    - job: 'warm cache review'
      optional: true
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CWA_CI_REVIEW_DISABLED != "true" && $CWA_CI_PERFORMANCE_AUDIT_REVIEW != "false"'
      when: manual
  script:
    - skip_unless_review_deployed
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit "https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit staging:
  stage: staging
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'staging'
    - job: 'warm cache staging'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_STAGING_ENABLED == "true" && $CWA_CI_PERFORMANCE_AUDIT_STAGING != "false"'
      when: manual
  script:
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit "https://staging.$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit canary:
  stage: canary
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'canary'
    - job: 'warm cache canary'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_CANARY_ENABLED == "true" && $CWA_CI_PERFORMANCE_AUDIT_CANARY == "true"'
      when: manual
  script:
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit "https://$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit production:
  stage: production
  image: $CWA_CI_PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'production'
    - job: 'warm cache production'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CWA_CI_PRODUCTION_DISABLED != "true" && $CWA_CI_PERFORMANCE_AUDIT_PRODUCTION != "false"'
      when: manual
  script:
    # cypress/browsers has no curl, which sitemap_pages needs.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null)
    - performance_audit "https://$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

load fixtures review:
  stage: review
  script:
    - skip_unless_review_deployed
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures review
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$CWA_CI_FIXTURES_ENABLED != "true"'
      when: never
    - if: '$CWA_CI_REVIEW_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['review']

load fixtures production:
  stage: production
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$CWA_CI_FIXTURES_ENABLED != "true"'
      when: never
    # It needs the production job.
    - if: '$CWA_CI_PRODUCTION_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['production']

stop review:
  stage: cleanup
  script:
    - skip_unless_review_deployed
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - delete review
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
  when: manual
  allow_failure: true
  only:
    refs:
      - branches
  needs: ['review']
  except:
    refs:
      - main
    variables:
      - $CWA_CI_REVIEW_DISABLED == "true"

canary:
  stage: canary
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - ensure_namespace
    - helm_init
    - apply_kube_context
    - create_docker_pull_secret
    - deploy canary
    - purge_rendered_html canary
    # Non-fatal by design; see the comment in the review job (#80).
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  when: manual
  # Needs the builds and tests too: without staging, needs: [] would deploy the
  # previous image. Optional, as the switches can remove them.
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'functional tests'
      optional: true
    - job: 'staging'
      optional: true
  only:
    refs:
      - main
    variables:
      - $CWA_CI_CANARY_ENABLED == "true"
