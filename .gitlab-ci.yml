production:
  stage: production
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy
    - purge_rendered_html
    # Non-fatal by design; see the comment in the review job (#80).
    - delete canary
    - delete staging
    - persist_environment_url
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  artifacts:
    paths: [ environment_url.txt ]
  when: manual
  retry: 1
  allow_failure: false
  needs:
    - job: 'staging'
      optional: true
  only:
    refs:
      - main
  except:
    variables:
      - $PRODUCTION_API_DISABLED == "true"

# Warm the page cache after deploys (#80). By default only PRODUCTION is warmed
# (turn it off with WARM_CACHE_PRODUCTION="false"); review, staging and canary
# are opt-in via WARM_CACHE_REVIEW / WARM_CACHE_STAGING / WARM_CACHE_CANARY="true".
# Each job reads the sitemap and requests every
# page anonymously so the first real visitors hit the cache. Each is its own job,
# needing its deploy job, with allow_failure: a page that does not return 200 shows
# the pipeline as "passed with warnings" and lists the pages in the job log, without
# marking a deploy that is already live as failed (and without the deploy job's
# retry redeploying it). The URL is passed explicitly; action: verify ties the job to
# the environment without recording a deployment.
warm cache review:
  stage: review
  needs: ['review']
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # Same conditions as the review deploy job (branches except main, unless
    # REVIEW_DISABLED), plus opt-in: review environments are not warmed unless
    # WARM_CACHE_REVIEW is "true".
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $REVIEW_DISABLED != "true" && $WARM_CACHE_REVIEW == "true"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN"

warm cache staging:
  stage: staging
  needs: ['staging']
  allow_failure: true
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # Same conditions as the staging deploy job, plus opt-in: staging is not
    # warmed unless WARM_CACHE_STAGING is "true".
    - if: '$CI_COMMIT_BRANCH == "main" && $STAGING_ENABLED == "true" && $WARM_CACHE_STAGING == "true"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://staging.$KUBE_INGRESS_BASE_DOMAIN"

warm cache canary:
  stage: canary
  needs: ['canary']
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # Same conditions as the canary deploy job, plus opt-in: canary is not
    # warmed unless WARM_CACHE_CANARY is "true".
    - if: '$CI_COMMIT_BRANCH == "main" && $CANARY_ENABLED == "true" && $WARM_CACHE_CANARY == "true"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://$KUBE_INGRESS_BASE_DOMAIN"

warm cache production:
  stage: production
  needs: ['production']
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    # Same conditions as the production deploy job. On by default: production
    # is the environment warming is for. Set WARM_CACHE_PRODUCTION to "false"
    # to turn it off.
    - if: '$CI_COMMIT_BRANCH == "main" && $PRODUCTION_API_DISABLED != "true" && $WARM_CACHE_PRODUCTION != "false"'
  script:
    - apk add --no-cache curl >/dev/null
    - warm_cache "https://$KUBE_INGRESS_BASE_DOMAIN"

# Lighthouse CI audit (#87): a MANUAL job after each deploy, never automatic. It is
# on by default for review, staging and production (set PERFORMANCE_AUDIT_REVIEW /
# _STAGING / _PRODUCTION to "false" to remove the job), and opt-in for canary
# (PERFORMANCE_AUDIT_CANARY="true"), because canary shares production's hostname
# and would measure whichever pod answers. It needs its deploy job and, when it
# exists, the warm job for the same track, so pages come from the cache.
# allow_failure: a missed budget shows as "passed with warnings" and never fails a
# live deploy, and an unrun manual job never blocks the pipeline. The HTML reports
# are kept as artifacts, and browser-performance.json feeds GitLab's merge request
# comparison (a paid GitLab feature; on Free the artifact is simply kept). See
# performance_audit in bin/devops/k8s.sh for the variables that tune it.
performance audit review:
  stage: review
  image: $PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'review'
    - job: 'warm cache review'
      optional: true
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $REVIEW_DISABLED != "true" && $PERFORMANCE_AUDIT_REVIEW != "false"'
      when: manual
  script:
    - performance_audit "https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit staging:
  stage: staging
  image: $PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'staging'
    - job: 'warm cache staging'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $STAGING_ENABLED == "true" && $PERFORMANCE_AUDIT_STAGING != "false"'
      when: manual
  script:
    - performance_audit "https://staging.$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit canary:
  stage: canary
  image: $PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'canary'
    - job: 'warm cache canary'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CANARY_ENABLED == "true" && $PERFORMANCE_AUDIT_CANARY == "true"'
      when: manual
  script:
    - performance_audit "https://$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

performance audit production:
  stage: production
  image: $PERFORMANCE_AUDIT_IMAGE
  needs:
    - job: 'production'
    - job: 'warm cache production'
      optional: true
  allow_failure: true
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PRODUCTION_API_DISABLED != "true" && $PERFORMANCE_AUDIT_PRODUCTION != "false"'
      when: manual
  script:
    - performance_audit "https://$KUBE_INGRESS_BASE_DOMAIN"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [ performance-report/ ]
    reports:
      browser_performance: performance-report/browser-performance.json

load fixtures review:
  stage: review
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures review
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$ENABLE_DATABASE_FIXTURES != "true"'
      when: never
    - if: '$REVIEW_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['review']

load fixtures staging:
  stage: staging
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures staging
  environment:
    name: production
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$ENABLE_DATABASE_FIXTURES != "true"'
      when: never
    - if: '$STAGING_ENABLED != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['staging']

load fixtures production:
  stage: production
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - load_fixtures
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  rules:
    - if: '$ENABLE_DATABASE_FIXTURES != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs: ['production']

stop review:
  stage: cleanup
  script:
    - install_dependencies
    - apply_kube_context
    - set_namespace
    - delete review
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
  when: manual
  allow_failure: true
  only:
    refs:
      - branches
  needs: ['review']
  except:
    refs:
      - main
    variables:
      - $REVIEW_DISABLED == "true"

canary:
  stage: canary
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - ensure_namespace
    - helm_init
    - apply_kube_context
    - create_docker_pull_secret
    - deploy canary
    - purge_rendered_html canary
    # Non-fatal by design; see the comment in the review job (#80).
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
  when: manual
  needs:
    - job: 'staging'
      optional: true
  only:
    refs:
      - main
    variables:
      - $CANARY_ENABLED == "true"
