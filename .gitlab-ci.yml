review:
  stage: review
  script:
    - check_kube_domain
    - install_dependencies
    - generate_jwt_keys
    - helm_init
    - apply_kube_context
    - ensure_namespace
    - create_docker_pull_secret
    - deploy review
    - purge_rendered_html review
    # Refill the page cache the purge just emptied, and report each page's
    - persist_environment_url
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_COMMIT_REF_SLUG-review.$KUBE_INGRESS_BASE_DOMAIN
    on_stop: stop review
  artifacts:
    paths: [ environment_url.txt ]
  only:
    refs:
      - branches
  needs:
    - job: 'build api'
      optional: true
    - job: 'build app'
      optional: true
    - job: 'unit tests'
      optional: true
    - job: 'behat tests'
      optional: true
  except:
    refs:
      - main
    variables:
      - $REVIEW_DISABLED == "true"

