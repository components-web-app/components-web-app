# The browser-test stack (#157): an overlay on compose.yaml + compose.prod.yaml (#207), so CI boots the single-server
# production config. It adds only CI stand-ins; e2e/run.sh starts it and sets the required values.
# Paths are relative to the first file's directory, the repository root.
name: cwa-e2e

services:
  database:
    volumes: !reset []
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      interval: 2s
      retries: 30

  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    # HTTPS for the browser (the page is HTTPS, so http:// images would be upgraded and fail), plain HTTP for php.
    command: ["-scheme", "both", "-port", "4443", "-port-http", "8000", "-public-host", "gcs:4443", "-external-url", "https://gcs:4443"]

  mailpit:
    image: axllent/mailpit:v1.31.6

  php:
    # This ref's image, never a build (#207).
    image: ${E2E_PHP_IMAGE:?set E2E_PHP_IMAGE}
    build: !reset null
    pull_policy: missing
    # The stack publishes nothing, so it runs beside the dev stack.
    ports: !reset []
    environment:
      MAILER_EMAIL: CWA Tests <tests@cwa.test>
      # Any 5xx during the run mails here; run.sh fails the run if one arrives (#162).
      ERROR_MAIL_TO: errors@cwa.test
      GCLOUD_API_ENDPOINT: http://gcs:8000
      GCLOUD_PUBLIC_URL: https://gcs:4443/cwa-e2e/
      # A review app's prefix, so uploads, variants and the stop-review delete run under one (#166).
      GCLOUD_PATH_PREFIX: review/e2e/
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@cwa.test

  app:
    image: ${E2E_APP_IMAGE:?set E2E_APP_IMAGE}
    build: !reset null
    pull_policy: missing

  tests:
    build: e2e
    profiles: [tests]
    environment:
      E2E_BASE_URL: https://localhost
      E2E_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      E2E_MAILPIT_URL: http://mailpit:8025
      CI: ${CI:-}
