name: Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        type: choice
        options:
          - canary
          - production
          - migrations-plan
          - database-backup
      # For this run only, never a repository variable (#180): maintenance on while pending migrations run.
      maintenance_during_migrations:
        description: 'Maintenance mode while pending migrations run (production)'
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  # Tests main's images before they are deployed (#157), when vars.CWA_CI_E2E_ENABLED is "true".
  browser-tests:
    name: Browser tests
    if: vars.CWA_CI_E2E_ENABLED == 'true' && vars.CWA_CI_TEST_DISABLED != 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/browser-tests.yml
    with:
      ref_slug: main

  deploy:
    name: Deploy ${{ inputs.action }}
    needs: [browser-tests]
    if: always() && needs.browser-tests.result != 'failure' && needs.browser-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    # packages: write tags the deployed images; with no build here, promote_images pins :main's current digest (#164).
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://${{ vars.KUBE_INGRESS_BASE_DOMAIN }}
    env:
      CI_REGISTRY: ghcr.io
      CI_REGISTRY_USER: ${{ github.actor }}
      CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      CI_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      CI_COMMIT_REF_SLUG: main
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: main
      CI_ENVIRONMENT_SLUG: production
      CI_ENVIRONMENT_URL: https://${{ vars.KUBE_INGRESS_BASE_DOMAIN }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH_SLUG: ${{ github.repository }}
      GITLAB_USER_EMAIL: ${{ github.actor }}@users.noreply.github.com
      KUBE_INGRESS_BASE_DOMAIN: ${{ vars.KUBE_INGRESS_BASE_DOMAIN }}
      KUBE_CONTEXT: ${{ secrets.KUBE_CONTEXT }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE_PRODUCTION }}
      RELEASE: ${{ vars.RELEASE_PRODUCTION }}
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      MERCURE_JWT_SECRET: ${{ secrets.MERCURE_JWT_SECRET }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      CORS_ALLOW_ORIGIN: ${{ vars.CORS_ALLOW_ORIGIN }}
      TRUSTED_HOSTS: ${{ vars.TRUSTED_HOSTS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      # Mail and the nightly orphan scan (#102). GitHub passes only variables a job
      # names. Without MAILER_DSN the chart uses the null transport (no email);
      # without MAILER_EMAIL the orphan scan sends no alert.
      MAILER_DSN: ${{ secrets.MAILER_DSN }}
      MAILER_EMAIL: ${{ vars.MAILER_EMAIL }}
      CWA_CI_ORPHAN_SCAN: ${{ vars.CWA_CI_ORPHAN_SCAN }}
      CWA_CI_ORPHAN_SCAN_SCHEDULE: ${{ vars.CWA_CI_ORPHAN_SCAN_SCHEDULE }}
      CWA_CI_ORPHAN_SCAN_TIMEZONE: ${{ vars.CWA_CI_ORPHAN_SCAN_TIMEZONE }}
      CWA_CI_FIXTURES_PURGE: ${{ vars.CWA_CI_FIXTURES_PURGE }}
      # Set here, so a repository variable of the same name is never exported (#180).
      CWA_CI_MAINTENANCE_DURING_MIGRATIONS: ${{ inputs.maintenance_during_migrations && 'true' || '' }}
      # Media storage. Without these three a GitHub deploy falls back to the
      # `no-gcloud-bucket` placeholder. GitLab exports CI/CD variables to the job
      # automatically; GitHub Actions does not, so each one must be mapped here.
      GCLOUD_JSON: ${{ secrets.GCLOUD_JSON }}
      # The database backup's own key (bin/devops/backup-bucket.sh), never the media key (#180).
      CWA_CI_DATABASE_BACKUP_GCLOUD_JSON: ${{ secrets.CWA_CI_DATABASE_BACKUP_GCLOUD_JSON }}
      GCLOUD_BUCKET: ${{ vars.GCLOUD_BUCKET }}
      GCLOUD_PUBLIC_URL: ${{ vars.GCLOUD_PUBLIC_URL }}
      # Optional; warm_cache defaults to 3 concurrent page requests.
      CWA_CI_WARM_CACHE_CONCURRENCY: ${{ vars.CWA_CI_WARM_CACHE_CONCURRENCY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expose repository variables to the scripts, as GitLab does
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: bin/devops/github-export-vars.sh
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBERNETES_VERSION || '1.31.0' }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ vars.HELM_VERSION || '3.19.0' }}
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      # After the setup actions, so they never see the secrets.
      - name: Expose NUXT_* and CWA_API_* secrets to the deploy
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: bin/devops/github-export-secrets.sh
      - name: Deploy canary
        if: inputs.action == 'canary'
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          check_kube_domain
          ensure_namespace
          helm_init
          apply_kube_context
          create_docker_pull_secret
          deploy canary
          purge_rendered_html canary
      # Generate missing image variants (#152). A failure never fails the live deploy.
      - name: Generate image variants
        if: inputs.action == 'canary' && vars.CWA_CI_IMAGE_VARIANTS_CANARY == 'true'
        continue-on-error: true
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          apply_kube_context
          generate_image_variants canary
      # Refill the page cache (#80). A failed page never fails the live deploy.
      - name: Warm the page cache
        if: inputs.action == 'canary' && vars.CWA_CI_WARM_CACHE_CANARY == 'true'
        continue-on-error: true
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          warm_cache
      - name: Deploy production
        if: inputs.action == 'production'
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          check_kube_domain
          helm_init
          apply_kube_context
          ensure_namespace
          create_docker_pull_secret
          deploy
          purge_rendered_html
          # Ends a maintenance window (#180); nothing to do without one.
          finish_maintenance_window
          # Non-fatal by design; see the comment in the canary step above (#80).
          delete canary
          delete staging
          persist_environment_url
      # A failed window leaves maintenance on: say what to do (#180).
      - name: Maintenance mode is still on
        if: failure() && inputs.action == 'production'
        run: '[ ! -f maintenance-window.txt ] || { cat maintenance-window.txt; echo "::error title=Maintenance mode is still on::see the step log"; }'
      # The pending migrations and their SQL for production, read-only, with main's php image (#180).
      - name: Migrations plan
        if: inputs.action == 'migrations-plan'
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          helm_init
          apply_kube_context
          migrations_plan stable
      # A database backup on demand (#180), with the backup bucket and key.
      - name: Database backup
        if: inputs.action == 'database-backup'
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          helm_init
          apply_kube_context
          database_backup_now stable
      # Off unless CWA_CI_FIXTURES_ENABLED is "true". See load_fixtures.
      - name: Load fixtures
        if: inputs.action == 'production' && vars.CWA_CI_FIXTURES_ENABLED == 'true'
        continue-on-error: true
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          apply_kube_context
          load_fixtures
      # Generate missing image variants (#152). A failure never fails the live deploy.
      - name: Generate image variants
        if: inputs.action == 'production' && vars.CWA_CI_IMAGE_VARIANTS_PRODUCTION != 'false'
        continue-on-error: true
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          apply_kube_context
          generate_image_variants
      # Refill the page cache (#80). A failed page never fails the live deploy.
      - name: Warm the page cache
        if: inputs.action == 'production' && vars.CWA_CI_WARM_CACHE_PRODUCTION != 'false'
        continue-on-error: true
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          warm_cache
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'production'
        with:
          name: environment-url
          path: environment_url.txt
