name: Performance audit

# Lighthouse CI audit (#87), run by hand. CWA_CI_PERFORMANCE_AUDIT_<ENV>="false"
# removes an environment. For a review app, run it from that branch.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to audit'
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
          - review
      form_factors:
        description: 'Form factors'
        required: true
        type: choice
        default: mobile
        options:
          - mobile
          - desktop
          - mobile,desktop

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit ${{ inputs.environment }}
    runs-on: ubuntu-latest
    if: |
      vars.CWA_CI_DISABLED != 'true' && (
        (inputs.environment == 'production' && vars.CWA_CI_PERFORMANCE_AUDIT_PRODUCTION != 'false') ||
        (inputs.environment == 'staging' && vars.CWA_CI_PERFORMANCE_AUDIT_STAGING != 'false') ||
        (inputs.environment == 'review' && vars.CWA_CI_PERFORMANCE_AUDIT_REVIEW != 'false')
      )
    env:
      KUBE_INGRESS_BASE_DOMAIN: ${{ vars.KUBE_INGRESS_BASE_DOMAIN }}
      CWA_CI_PERFORMANCE_AUDIT_FORM_FACTORS: ${{ inputs.form_factors }}
      CWA_CI_PERFORMANCE_AUDIT_URLS: ${{ vars.CWA_CI_PERFORMANCE_AUDIT_URLS }}
      CWA_CI_PERFORMANCE_AUDIT_MAX_PAGES: ${{ vars.CWA_CI_PERFORMANCE_AUDIT_MAX_PAGES }}
      CWA_CI_PERFORMANCE_AUDIT_RUNS: ${{ vars.CWA_CI_PERFORMANCE_AUDIT_RUNS }}
      CWA_CI_PERFORMANCE_AUDIT_CONFIG: ${{ vars.CWA_CI_PERFORMANCE_AUDIT_CONFIG }}
      CWA_CI_PERFORMANCE_AUDIT_LHCI_VERSION: ${{ vars.CWA_CI_PERFORMANCE_AUDIT_LHCI_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Expose repository variables to the scripts, as GitLab does
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: bin/devops/github-export-vars.sh
      - name: Work out the environment URL
        id: url
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$ENVIRONMENT" in
            production) url="https://${KUBE_INGRESS_BASE_DOMAIN}" ;;
            staging) url="https://staging.${KUBE_INGRESS_BASE_DOMAIN}" ;;
            review)
              # Same slug as the setup job in ci.yml.
              slug=$(echo "$REF_NAME" | tr '[:upper:]/' '[:lower:]-' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g;s/^-//;s/-$//' | cut -c1-56)
              url="https://${slug}-review.${KUBE_INGRESS_BASE_DOMAIN}"
              ;;
          esac
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      # Through setup.sh, so a DOMAIN from bin/devops/project.sh wins over this URL (#132).
      # Unset repository variables arrive as empty strings, which performance_audit treats as unset.
      - name: Performance audit
        env:
          CI_ENVIRONMENT_URL: ${{ steps.url.outputs.url }}
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
        run: |
          source ./bin/devops/setup.sh
          source ./bin/devops/k8s.sh
          echo "Auditing https://${DOMAIN}"
          performance_audit
      - name: Upload the performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ inputs.environment }}
          path: performance-report/
          if-no-files-found: ignore
          retention-days: 30
