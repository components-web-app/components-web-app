name: Publish create-cwa

on:
  push:
    tags:
      - 'create-cwa/v*'

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-cwa
    steps:
      - uses: actions/checkout@v4

      # The template this CLI installs pulls cwa-php-base:<version>: it must exist and be public first (#208).
      - name: Check the php base image is published and public
        run: |
          set -eu
          V=$(node -p "require('./package.json').version")
          T=$(curl -fsS "https://ghcr.io/token?scope=repository:components-web-app/cwa-php-base:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          curl -fsS -o /dev/null -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/components-web-app/cwa-php-base/manifests/$V" \
            || { echo "::error::ghcr.io/components-web-app/cwa-php-base:$V is missing or private: wait for publish-php-base.yml on v$V, and make the package public"; exit 1; }

      # Its run also smoke-tests the release on that image (#226): publish only after the newest run for v<version> passed.
      - name: Check publish-php-base.yml passed on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V=$(node -p "require('./package.json').version")
          c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow publish-php-base.yml --branch "v$V" --event push --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          [ "$c" = "completed success" ] || { echo "::error::publish-php-base.yml on v$V is '${c:-missing}', not 'completed success': wait for it (or rerun its failed jobs), then re-run this workflow"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      # Every CWA release is still a prerelease (2.0.0-alpha.N). npm won't publish one
      # without an explicit dist-tag, and `pnpm create cwa` must get it, so it goes
      # out as `latest`. Revisit once there are stable releases to keep `latest` for.
      - name: Publish
        run: pnpm publish --provenance --access public --no-git-checks --tag latest
