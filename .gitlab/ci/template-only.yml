# The template's own jobs (#181). Projects made from the template never get this file: create-cwa leaves it out
# (cwa-manifest.json alwaysExclude) and .gitlab-ci.yml includes it only when it exists. Don't copy it downstream.

# Reloads the demo site from its scaffold every day: a purged production fixture load (which flushes and warms /_api), then
# the page warm. Only from a pipeline schedule on the default branch with CWA_CI_DEMO_RELOAD="true" (CLAUDE.md, #181).
demo reload production:
  stage: production
  needs: []
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    action: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CWA_CI_DEMO_RELOAD == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # In the script, so a project-level CWA_CI_FIXTURES_PURGE can't override it.
    - export CWA_CI_FIXTURES_PURGE=force
    - !reference ['load fixtures production', script]
    - warm_cache

# Creates a project from this ref with the built create-cwa, runs its bin/up and checks the login (#215; GitHub: create-cwa-smoke.yml).
# The project is made under $CI_PROJECT_DIR because dind shares only the builds directory, which compose.override.yaml bind-mounts.
create-cwa smoke:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
  needs: []
  dependencies: []
  parallel:
    matrix:
      - SMOKE_FEATURES: all
        SMOKE_FIXTURES: "true"
      - SMOKE_FEATURES: none
        SMOKE_FIXTURES: "false"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CWA_CI_TEST_DISABLED == "true" || $CI_COMMIT_BRANCH == null'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - .gitlab/ci/template-only.yml
        - packages/create-cwa/**/*
        - cwa-manifest.json
        - bin/up
        - compose.yaml
        - compose.override.yaml
        - api/Dockerfile
        - api/.dockerignore
        - api/frankenphp/**/*
        - api/composer.json
        - api/composer.lock
        - api/src/DataFixtures/**/*
        - app/Dockerfile
        - app/.dockerignore
        - app/package.json
        - app/pnpm-lock.yaml
        - app/pnpm-workspace.yaml
    - when: manual
      allow_failure: true
  script:
    - apk add --no-cache nodejs npm git >/dev/null
    - npm install -g pnpm@12 >/dev/null
    - setup_docker_environment
    - sh packages/create-cwa/smoke.sh "$CI_PROJECT_DIR/.create-cwa-smoke"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .create-cwa-smoke/create-cwa.log
