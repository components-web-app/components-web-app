expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0
; Sized for 20 MB photo uploads. GD decodes a ~24-megapixel JPEG to roughly 100-150 MB,
; and the bundle generates the imagine thumbnail inside the upload request
; (UploadableFileManager), so 256M wasn't enough. This is a per-request ceiling, not a
; reservation: ordinary API requests still use 20-50 MB. The worker pool is fixed in
; worker.Caddyfile and the pod limit is 1Gi, which keeps the worst case in budget.
memory_limit = 512M
short_open_tag = 0
; PHP's M is MiB: 20M is slightly more than the 20,000,000 bytes Image::$file allows
; (Symfony's '20M' is decimal), so a file that passes validation always fits.
upload_max_filesize = 20M
post_max_size = 21M

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.enable_file_override = 1
