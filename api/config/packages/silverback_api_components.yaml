silverback_api_components:
    website_name: New Website
    refresh_token:
        handler_id: silverback.api_components.refresh_token.storage.doctrine
        options:
            class: App\Entity\RefreshToken
        cookie_name: api_component
        ttl: 604800 # 1 week
        database_user_provider: database
    user:
        class_name: App\Entity\User
        email_links:
            # A single-host site needs only this: see app.email_link_default_origin
            # in services.php. Add allowed_origins only if emails must link to more
            # than one front end.
            default_origin: '%app.email_link_default_origin%'
        email_verification:
            default_value: false
            verify_on_register: true
            verify_on_change: true
            deny_unverified_login: true
            email:
                redirect_path_query: null
                default_redirect_path: /verify-email/{{ username }}/{{ token }}
        password_reset:
            email:
                redirect_path_query: null
                default_redirect_path: /reset-password/{{ username }}/{{ token }}
        new_email_confirmation:
            email:
                redirect_path_query: null
                default_redirect_path: /confirm-new-email/{{ username }}/{{ new_email }}/{{ token }}
    publishable:
        permission: "is_granted('ROLE_ADMIN')"
    route_security:
        - { route: "/user-area*", security: "is_granted('ROLE_USER')" }
    routable_security: "is_granted('ROLE_ADMIN')"
    mercure:
      cookie:
        samesite: '%env(JWT_COOKIE_SAMESITE)%'
    # The daily scan (#101) emails the site's own address when the orphans change.
    # An empty or unset MAILER_EMAIL means no email. `string:` matters: `default::`
    # alone gives null, which the notifier rejects (api-components-bundle#365).
    orphaned_resources:
        notify:
            recipients: '%env(string:default::MAILER_EMAIL)%'
