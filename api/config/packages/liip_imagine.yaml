liip_imagine:
  # libvips (#141); gd is the fallback and stays installed.
  driver: vips
  data_loader: silverback.api_components.liip_imagine.binary.loader
  cache: in_memory_cache_resolver
  # Every variant is WebP whatever the upload's format (#149); vips always saves WebP at 80, quality sets gd's to match.
  filter_sets:
    thumbnail:
      format: webp
      quality: 80
      filters:
        thumbnail:
          size: [ 500, 500 ]
          mode: inset
    # Display size: the layout's widest content column (max-w-7xl less padding) is 1216 px (#143).
    general:
      format: webp
      quality: 80
      filters:
        thumbnail:
          size: [ 1200, 1200 ]
          mode: inset
    # general at 2x, so a retina screen's srcset doesn't fall through to the original upload.
    large:
      format: webp
      quality: 80
      filters:
        thumbnail:
          size: [ 2400, 2400 ]
          mode: inset
