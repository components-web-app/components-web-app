nelmio_cors:
    defaults:
        allow_credentials: true
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # X-CWA-Client-Id: the module's co-editing writes send it (cwa-nuxt-module#429, #219).
        allow_headers: ['Content-Type', 'Authorization', 'Preload', 'Fields', 'Path', 'X-CWA-Client-Id', 'If-Match']
        # Retry-After (#100) and ETag (#219, read back as If-Match): only matter
        # when the API is on another origin.
        expose_headers: ['Link', 'Retry-After', 'ETag']
        max_age: 3600
    paths:
        '^/': null
