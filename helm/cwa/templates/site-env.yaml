{{- /* Site settings passed through by k8s.sh (#125): see siteEnv in values.yaml.
Values arrive base64-encoded, so quotes, colons and newlines survive. Each object
is rendered only when it has something in it; cwa.siteEnvFrom adds the matching
envFrom entries. The PWA's NUXT_PUBLIC_* values are public (Nuxt sends them to
browsers), so they go in a ConfigMap; everything else is a Secret. */}}
{{- $fullName := include "cwa.fullname" . }}
{{- with .Values.siteEnv.pwa }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-pwa-env
  labels:
    {{- include "cwa.labels" $ | nindent 4 }}
data:
  {{- range $name, $value := . }}
  {{ $name | quote }}: {{ $value | b64dec | quote }}
  {{- end }}
{{- end }}
{{- range $side := list "pwa" "api" }}
{{- with index $.Values.siteEnv (printf "%sSecret" $side) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-{{ $side }}-env
  labels:
    {{- include "cwa.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := . }}
  {{- /* Decoded and re-encoded, so the stored value is always valid base64. */}}
  {{ $name | quote }}: {{ $value | b64dec | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
