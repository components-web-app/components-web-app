{{- $fullName := include "cwa.fullname" . -}}
{{- $primaryHost := index .Values.ingress.hosts 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 2
     maxUnavailable: "25%"
  selector:
    matchLabels:
      {{- include "cwa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        # Single replica: stop the cluster autoscaler evicting it to consolidate nodes.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cwa.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cwa.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-php
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.php.image.repository }}:{{ .Values.php.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.php.image.pullPolicy }}
          env:
            {{- include "cwa.phpEnv" . | nindent 12 }}
            # Not in cwa.phpEnv: the entrypoint drops the schema when this is
            # "true", and the orphan scan CronJob must never do that (#103).
            - name: RESET_DATABASE
              value: {{ .Values.php.resetDatabase | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/bin/sleep 1; kill -QUIT 1"]
          # Startup covers the whole boot (database wait, migrations, ANALYZE)
          # before Caddy listens: 60 x 5s = the same 300s budget as before, but
          # polled twice as often so readiness can start within ~5s of Caddy
          # coming up. Readiness and liveness only run once this has passed.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          # Is php still answering? A TCP check only proved Caddy was listening, so
          # a pod whose php had stopped answering stayed alive, unready and out of
          # service until someone restarted it by hand (35h on cymru-kitchens,
          # 2026-09-30). This is the readiness request, which the Caddyfile keeps
          # out of the cache for the kubelet, so it reaches php every time. 6 x 10s
          # is a minute of failures before a restart: long enough to ride out a
          # burst that queues behind the 4 workers, while readiness has already
          # taken the pod out of service after 30s.
          livenessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          # is the container ready for traffic, everything is going and ready?
          readinessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            # 5s, not 30s. The startup probe already holds readiness back until
            # Caddy listens, so a long delay here only kept a ready pod out of
            # service: measured on staging, Caddy served at +6s but the pod went
            # Ready at +30-39s. That is 24-33s of avoidable downtime every time the
            # single API pod is evicted or its node is upgraded.
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            # Unset, this defaults to 1s, which a cold worker's first request can
            # exceed. Measured on staging, the very first request to this path,
            # made the instant Caddy started, took 0.16s, so 5s leaves about 30x
            # headroom.
            #
            # A probe that gave up mid-flight used to cost the pod for good. Souin
            # coalesced the cached path's fetches through singleflight, and an
            # abandoned call held the key, so every later probe waited out the 10s
            # backend timeout and 504'd, and the TCP liveness check never noticed
            # (#62, a pod stuck 0/1 for three hours; cymru-kitchens for 35h on
            # 2026-09-30). Three things now stop that: the Caddyfile keeps the
            # kubelet's requests to this path out of the cache, the Souin build
            # carries the darkweak/souin#850 fix so a timed-out call releases its
            # key, and the liveness probe above restarts a pod whose php has
            # stopped answering.
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.php.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
