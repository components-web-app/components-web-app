{{- $fullName := include "cwa.fullname" . -}}
{{- $apiPods := ternary .Values.autoscaling.maxReplicas .Values.replicaCount .Values.autoscaling.enabled }}
{{- if and (not (include "cwa.scaled" .)) (or (gt (int $apiPods) 1) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) 1))) }}
{{- fail "More than one API pod needs scaled.enabled: a second pod's cache is never purged (#85)." }}
{{- end }}
{{- $primaryHost := index .Values.ingress.hosts 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
spec:
  {{- if not (include "cwa.hpaEnabled" .) }}
  replicas: {{ ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled }}
  {{- end }}
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 2
     maxUnavailable: "25%"
  selector:
    matchLabels:
      {{- include "cwa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        checksum/site-env: {{ include (print $.Template.BasePath "/site-env.yaml") . | sha256sum }}
        {{- if not (include "cwa.scaled" .) }}
        {{- /* Scaled mode has the PDB instead (#85). */}}
        # Single replica: stop the cluster autoscaler evicting it to consolidate nodes.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- end }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cwa.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cwa.serviceAccountName" . }}
      {{- if include "cwa.scaled" . }}
      # One API pod per node where possible, so losing a node never takes them all (#85).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cwa.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-php
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.php.image.repository }}:{{ .Values.php.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.php.image.pullPolicy }}
          env:
            {{- include "cwa.phpEnv" . | nindent 12 }}
            # Not in cwa.phpEnv: the entrypoint drops the schema when this is
            # "true", and the orphan scan CronJob must never do that (#103).
            - name: RESET_DATABASE
              value: {{ .Values.php.resetDatabase | quote }}
            # The php memory budget (#136); also reserved names for siteEnv in k8s.sh.
            - name: FRANKENPHP_WORKER_NUM
              value: {{ .Values.php.workers | quote }}
            - name: FRANKENPHP_MEMORY_LIMIT
              value: {{ include "cwa.php.memoryLimit" . | quote }}
            {{- with include "cwa.php.goMemLimit" . }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
          {{- with include "cwa.siteEnvFrom" (dict "ctx" . "side" "api") }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Keeps serving while the ingress drops the pod's endpoint (#148); then the kubelet's SIGTERM stops Caddy within its grace_period (#85).
          lifecycle:
            {{- $warmMaxTime := int .Values.php.warmHttpCacheMaxTime }}
            {{- /* Scaled mode skips it: the shared cache is already warm, and the deploy warms after its flush (#85). */}}
            {{- if and (gt $warmMaxTime 0) (not (include "cwa.scaled" .)) }}
            # Warms /_api before the probes start (#160): SSR's gzip keys, then browsers' and Cloudflare's br (#170); at most 2 x maxTime + 270s, never fails the container.
            postStart:
              exec:
                command: ["/bin/sh", "-c", "timeout {{ add (mul $warmMaxTime 2) 270 }} sh -c 'until curl -fs -o /dev/null http://localhost/_api/_/site_config_parameters.jsonld; do sleep 2; done; php bin/console silverback:api-components:warm-http-cache --max-time={{ $warmMaxTime }} --no-interaction; php bin/console silverback:api-components:warm-http-cache --accept-encoding=br --max-time={{ $warmMaxTime }} --no-interaction' >/proc/1/fd/1 2>&1 || true"]
            {{- end }}
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/bin/sleep 5"]
          # The whole boot (database wait, migrations, ANALYZE): 60 x 5s, from when postStart returns. Readiness and liveness wait for it.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          # Restarts a pod whose php stops answering after a minute of failures, on readiness's uncached request (#104).
          livenessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          # is the container ready for traffic, everything is going and ready?
          readinessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            # Short: the startup probe already holds readiness back until Caddy listens.
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            # Keep 5s: the 1s default can lose a cold worker's first request. The Caddyfile keeps probes off the cache (#62, #104).
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.php.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
