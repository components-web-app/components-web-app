{{- $fullName := include "cwa.fullname" . -}}
{{- $primaryHost := index .Values.ingress.hosts 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 2
     maxUnavailable: "25%"
  selector:
    matchLabels:
      {{- include "cwa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        # Single replica: stop the cluster autoscaler evicting it to consolidate nodes.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cwa.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cwa.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-php
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.php.image.repository }}:{{ .Values.php.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.php.image.pullPolicy }}
          env:
            - name: BROWSER_SERVER_NAME
              value: {{ $primaryHost.host | quote }}
            - name: SERVER_NAME
              value: :80
            - name: APP_UPSTREAM
              value: {{ include "cwa.fullname" . }}-pwa:3000
            - name: MERCURE_PUBLISHER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: mercure-publisher-jwt-key
            - name: MERCURE_SUBSCRIBER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: mercure-subscriber-jwt-key
            - name: MERCURE_PUBLISHER_JWT_ALG
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: mercure-publisher-jwt-algorithm
            - name: MERCURE_SUBSCRIBER_JWT_ALG
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: mercure-subscriber-jwt-algorithm
            - name: TRUSTED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: php-trusted-hosts
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: php-trusted-proxies
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: php-app-env
            - name: APP_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: php-app-debug
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: php-app-secret
            - name: CORS_ALLOW_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: php-cors-allow-origin
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: database-url
            - name: CADDY_GLOBAL_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: caddy-global-options
            - name: CADDY_CACHE_CDN_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: caddy-cache-cdn-config
            - name: CADDY_CACHE_EXTRA_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: caddy-cache-storage-config
            - name: MERCURE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: mercure-url
            - name: MERCURE_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: mercure-public-url
            - name: MERCURE_EXTRA_DIRECTIVES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: mercure-extra-directives
            - name: MERCURE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.fullname" . }}
                  key: mercure-subscriber-jwt-key
            - name: MERCURE_CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: mercure-cors-origin
            - name: MERCURE_JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: php-mercure-jwt-algorithm
            - name: JWT_COOKIE_SAMESITE
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: jwt-cookie-samesite
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: jwt-secret
            - name: JWT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: jwt-public
            - name: JWT_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: jwt-passphrase
            - name: MAILER_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: mailer-email
            - name: MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: mailer-dsn
            - name: DATABASE_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: database-ssl-ca
            - name: DATABASE_CLIENT_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: database-ssl-cert
            - name: DATABASE_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: database-ssl-key
            - name: DATABASE_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: database-ssl-mode
            - name: GCLOUD_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: gcloud-json
            - name: GCLOUD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: gcloud-bucket
            - name: GCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: gcloud-public-url
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: admin-password
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: admin-email
            - name: CACHE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: cache-url
            - name: RESET_DATABASE
              value: {{ .Values.php.resetDatabase | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: admin
              containerPort: 2019
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/bin/sleep 1; kill -QUIT 1"]
          # Startup covers the whole boot (database wait, migrations, ANALYZE)
          # before Caddy listens: 60 x 5s = the same 300s budget as before, but
          # polled twice as often so readiness can start within ~5s of Caddy
          # coming up. Readiness and liveness only run once this has passed.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          # is the container live and does not need restarting
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # is the container ready for traffic, everything is going and ready?
          readinessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            # 5s, not 30s. The startup probe already holds readiness back until
            # Caddy listens, so a long delay here only kept a ready pod out of
            # service: measured on staging, Caddy served at +6s but the pod went
            # Ready at +30-39s. That is 24-33s of avoidable downtime every time the
            # single API pod is evicted or its node is upgraded.
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            # Unset, this defaults to 1s, and a probe that gives up mid-flight is
            # not merely a failed probe here. This path is cached (it matches
            # @use_cache in the Caddyfile), and Souin coalesces upstream fetches
            # through singleflight keyed on the cache key; a caller that
            # disconnects before the shared fetch returns leaves that entry
            # holding a WaitGroup nobody releases, so every later request for the
            # same key - which means every subsequent probe - blocks until the 10s
            # backend timeout and 504s. The pod then never becomes ready and never
            # recovers. The first probe lands on a cold worker: exactly the race
            # this needs slack for. Measured on staging, the very first request
            # to this path, made the instant Caddy started, took 0.16s, so 5s
            # leaves about 30x headroom. Keep this at 5 whatever the delay above.
            # See components-web-app#62 for the incident that found it
            # (a production pod stuck 0/1 for three hours after a node upgrade)
            # and darkweak/souin#849, where a fix is pending for the underlying
            # defect - a stalled call should not cost the key.
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.php.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
