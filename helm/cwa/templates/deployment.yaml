{{- $fullName := include "cwa.fullname" . -}}
{{- $primaryHost := index .Values.ingress.hosts 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 2
     maxUnavailable: "25%"
  selector:
    matchLabels:
      {{- include "cwa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        checksum/site-env: {{ include (print $.Template.BasePath "/site-env.yaml") . | sha256sum }}
        # Single replica: stop the cluster autoscaler evicting it to consolidate nodes.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cwa.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cwa.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-php
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.php.image.repository }}:{{ .Values.php.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.php.image.pullPolicy }}
          env:
            {{- include "cwa.phpEnv" . | nindent 12 }}
            # Not in cwa.phpEnv: the entrypoint drops the schema when this is
            # "true", and the orphan scan CronJob must never do that (#103).
            - name: RESET_DATABASE
              value: {{ .Values.php.resetDatabase | quote }}
            # The php memory budget (#136); also reserved names for siteEnv in k8s.sh.
            - name: FRANKENPHP_WORKER_NUM
              value: {{ .Values.php.workers | quote }}
            - name: FRANKENPHP_MEMORY_LIMIT
              value: {{ include "cwa.php.memoryLimit" . | quote }}
            {{- with include "cwa.php.goMemLimit" . }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
          {{- with include "cwa.siteEnvFrom" (dict "ctx" . "side" "api") }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/bin/sleep 1; kill -QUIT 1"]
          # The whole boot (database wait, migrations, ANALYZE): 60 x 5s. Readiness and liveness wait for it.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          # Restarts a pod whose php stops answering after a minute of failures, on readiness's uncached request (#104).
          livenessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          # is the container ready for traffic, everything is going and ready?
          readinessProbe:
            httpGet:
              path: /_api/_/site_config_parameters.jsonld
              port: http
              httpHeaders:
              - name: Accept
                value: application/ld+json,application/json
            # Short: the startup probe already holds readiness back until Caddy listens.
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            # Keep 5s: the 1s default can lose a cold worker's first request. The Caddyfile keeps probes off the cache (#62, #104).
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.php.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
