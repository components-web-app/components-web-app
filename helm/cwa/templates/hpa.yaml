{{- if include "cwa.hpaEnabled" . }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cwa.fullname" . }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Must equal deployment.yaml's name, the bare fullname (#69).
    name: {{ include "cwa.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- /* Not in scaled mode: php rarely hands memory back, so a memory target would hold the HPA at its max (#85). */}}
    {{- if and .Values.autoscaling.targetMemoryUtilizationPercentage (not (include "cwa.scaled" .)) }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- if include "cwa.scaled" . }}
  # Add pods at once, remove them slowly: a warm surge or a spike's pods stay ten minutes (#85).
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 600
  {{- end }}
{{- end }}
