{{- if .Values.cronjobs.console.enabled }}
# Never scheduled: the template `run_console_job` (bin/devops/k8s.sh) makes one-off console Jobs from, never the serving API pod (#229).
# Its pods get their own name label so the API Service never selects them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cwa.fullname" . }}-console
  labels:
    helm.sh/chart: {{ include "cwa.chart" . }}
    app.kubernetes.io/name: {{ include "cwa.name" . }}-console
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  # Jobs created --from this CronJob are owned by it: a limit of 0 deletes each one before run_console_job reads it.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.cronjobs.console.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "cwa.name" . }}-console
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "cwa.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ .Chart.Name }}-console
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.php.image.repository }}:{{ .Values.php.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.php.image.pullPolicy }}
              # Through the image's entrypoint; run_console_job replaces these args with its command.
              args: ["bin/console", "list"]
              env:
                {{- include "cwa.phpEnv" . | nindent 16 }}
                {{- if not .Values.php.skipMigrations }}
                # Console Jobs never migrate: the API pods do before they're ready (#229).
                - name: SKIP_MIGRATIONS
                  value: "true"
                {{- end }}
              {{- with include "cwa.siteEnvFrom" (dict "ctx" . "side" "api") }}
              {{- . | nindent 14 }}
              {{- end }}
              resources:
                {{- toYaml .Values.cronjobs.console.resources | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
