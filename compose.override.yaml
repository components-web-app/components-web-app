# Development environment override
services:
  php:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - /app/var
      # No single-file bind mounts: they truncate a longer edited file (#57). On Mac or Windows, the next line speeds up vendor/:
      #- /app/vendor
    entrypoint: /app/frankenphp/docker-entrypoint.sh
    # Mirrors the frankenphp_dev CMD in api/Dockerfile, but reads the Caddyfile
    # through the directory mount above. Keep the two in sync.
    command: ["frankenphp", "run", "--config", "/app/frankenphp/Caddyfile", "--watch"]
    environment:
      MERCURE_EXTRA_DIRECTIVES: debugger # Mercure 1.0's debugging UI (replaces `demo`, removed in 1.0). Dev only.
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      # CADDY_GLOBAL_CONFIG: "local_certs"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: '900M'
        reservations:
          cpus: '1'
          memory: '700M'

  app:
    build:
      context: ./app
      target: dev
    volumes:
      - ./app:/srv/app:rw,cached
      - ./app/node_modules:/srv/app/node_modules:rw,cached
      - /srv/app/.pnpm-store
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NUXT_CWA_API_URL: ${API_URL:-https://php.local/_api}
      NUXT_PUBLIC_CWA_API_URL_BROWSER: ${API_URL_BROWSER:-https://localhost/_api}
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
    links:
      - "php:php.local"

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
