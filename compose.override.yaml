# Development environment override
services:
  php:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - /app/var
      # Deliberately no single-file bind mounts here. A single-file mount caches
      # the file's size, so an edit that replaces it with a longer file is served
      # to the container truncated to the old length, and Caddy then fails to
      # parse a file that is perfectly valid on disk (issue #57). The ./api:/app
      # directory mount above already exposes these same files and is immune, so
      # the entrypoint and command below read them from /app/frankenphp instead.
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    entrypoint: /app/frankenphp/docker-entrypoint.sh
    # Mirrors the frankenphp_dev CMD in api/Dockerfile, but reads the Caddyfile
    # through the directory mount above. Keep the two in sync.
    command: ["frankenphp", "run", "--config", "/app/frankenphp/Caddyfile", "--watch"]
    environment:
      MERCURE_EXTRA_DIRECTIVES: demo # - CHECK WHETHER WE STILL NEED THIS PATH ARG (/srv/mercure-assets/)
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      # CADDY_GLOBAL_CONFIG: "local_certs"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: '900M'
        reservations:
          cpus: '1'
          memory: '700M'

  app:
    build:
      context: ./app
      target: dev
    volumes:
      - ./app:/srv/app:rw,cached
      - ./app/node_modules:/srv/app/node_modules:rw,cached
      - /srv/app/.pnpm-store
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      NUXT_PUBLIC_CWA_API_URL: ${API_URL:-https://php.local/_api}
      NUXT_PUBLIC_CWA_API_URL_BROWSER: ${API_URL_BROWSER:-https://localhost/_api}
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
    links:
      - "php:php.local"

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
